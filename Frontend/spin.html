<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Working on it — Sankhya Setu</title>
<meta name="description" content="Sankhya Setu reads what your role needs, runs a short quiz to find your gaps, and routes you straight to the right course on iGOT Karmayogi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body data-screen="spin">

<div class="bg-glow" aria-hidden="true"></div>

<div id="app">
  <section class="screen active" id="screen-spin">
    <div class="wrap" style="justify-content:center; align-items:center; text-align:center;">
      <div class="tally"><div class="stroke"></div><div class="stroke on"></div><div class="stroke"></div><div class="stroke"></div></div>
      <div class="spin-mark" id="spinMark"></div>
      <h1 style="margin-top:0;" id="spin-title">Building your quiz…</h1>
      <p class="lede" id="spin-sub">5 quick questions per skill area. AI checks not just what you answered, but why.</p>
    </div>
  </section>
</div>

<div class="profile-fab" id="profileFab" title="Your profile" style="display:none;">
  <span id="fabInitials">--</span>
  <img id="fabImg" style="display:none;" alt="">
</div>

<div class="demo-jump">
  <div class="demo-menu" id="demoMenu">
    <div class="lbl">Jump to screen (demo)</div>
    <button onclick="jump('landing')">0 · Landing</button>
    <button onclick="jump('login')">1 · Login</button>
    <button onclick="jump('signup-1')">1b · Sign up</button>
    <button onclick="jump('role')">2 · Pick role</button>
    <button onclick="jump('upload')">3 · Upload material</button>
    <button onclick="jump('spin')">4 · Scoring</button>
    <button onclick="jump('quiz')">5 · Quiz</button>
    <button onclick="jump('results')">6 · Results</button>
    <button onclick="jump('practice')">7 · Learn</button>
    <button onclick="jump('progress')">8 · Progress</button>
    <button onclick="jump('profile')">9 · Profile</button>
  </div>
  <button onclick="toggleDemoMenu()" aria-label="Jump to screen">::</button>
</div>

<footer class="appfoot"></footer>

<script src="app.js"></script>
</body>
</html>
