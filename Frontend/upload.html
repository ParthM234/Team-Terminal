<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload material — Sankhya Setu</title>
<meta name="description" content="Sankhya Setu reads what your role needs, runs a short quiz to find your gaps, and routes you straight to the right course on iGOT Karmayogi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body data-screen="upload">

<div class="bg-glow" aria-hidden="true"></div>

<div id="app">
  <section class="screen active" id="screen-upload">
    <div class="wrap">
      <div class="tally"><div class="stroke on"></div><div class="stroke"></div><div class="stroke"></div><div class="stroke"></div></div>
      <h1>Upload material instead</h1>
      <p class="lede">We'll read it and build a quiz from what's actually inside it.</p>

      <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <div class="up-ic">↑</div>
        <h3>Tap to choose a file</h3>
        <p>or drag it in here</p>
        <div class="fmt-row">
          <span class="fmt-chip">PDF</span>
          <span class="fmt-chip">PPT</span>
          <span class="fmt-chip">DOCX</span>
          <span class="fmt-chip">TXT</span>
        </div>
        <input type="file" id="fileInput" style="display:none;" onchange="filePicked(this)">
      </div>

      <div class="file-picked" id="filePicked">
        <div class="fi">PDF</div>
        <div>
          <div class="fn" id="fileName">Survey_Methodology_Notes.pdf</div>
          <div class="fs">Ready to scan</div>
        </div>
      </div>

      <div class="spacer"></div>
      <div class="stack">
        <button class="btn btn-solid" id="upload-continue" onclick="startQuiz('material')" disabled>Generate my quiz</button>
        <button class="btn-ghost" onclick="goScreen('role')" style="margin:0 auto;">&larr; Back to role selection</button>
      </div>
    </div>
  </section>
</div>

<div class="profile-fab" id="profileFab" title="Your profile" style="display:none;">
  <span id="fabInitials">--</span>
  <img id="fabImg" style="display:none;" alt="">
</div>

<div class="demo-jump">
  <div class="demo-menu" id="demoMenu">
    <div class="lbl">Jump to screen (demo)</div>
    <button onclick="jump('landing')">0 · Landing</button>
    <button onclick="jump('login')">1 · Login</button>
    <button onclick="jump('signup-1')">1b · Sign up</button>
    <button onclick="jump('role')">2 · Pick role</button>
    <button onclick="jump('upload')">3 · Upload material</button>
    <button onclick="jump('spin')">4 · Scoring</button>
    <button onclick="jump('quiz')">5 · Quiz</button>
    <button onclick="jump('results')">6 · Results</button>
    <button onclick="jump('practice')">7 · Learn</button>
    <button onclick="jump('progress')">8 · Progress</button>
    <button onclick="jump('profile')">9 · Profile</button>
  </div>
  <button onclick="toggleDemoMenu()" aria-label="Jump to screen">::</button>
</div>

<footer class="appfoot"></footer>

<script src="app.js"></script>
</body>
</html>
