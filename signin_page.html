<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iGOT Skill Platform - Sign Up</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        .card h2 { margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #004085; }
        #message { margin-top: 15px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h2>Official Registration</h2>
    <form id="signupForm">
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" required>
        </div>
        <div class="form-group">
            <label for="email">Official Email</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required>
        </div>
        <div class="form-group">
            <label for="jobRole">Job Role</label>
            <select id="jobRole" required>
                <option value="">Select Role</option>
                <option value="Statistical Officer">Statistical Officer</option>
                <option value="Data Analyst">Data Analyst</option>
                <option value="Director / Deputy Director">Director / Deputy Director</option>
            </select>
        </div>
        <button type="submit">Create Account</button>
    </form>
    <div id="message"></div>
</div>

<script>
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const payload = {
            full_name: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            job_role: document.getElementById('jobRole').value
        };

        const response = await fetch('/api/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const result = await response.json();
        const msgDiv = document.getElementById('message');
        
        if (response.ok) {
            msgDiv.style.color = 'green';
            msgDiv.innerText = result.message;
            document.getElementById('signupForm').reset();
        } else {
            msgDiv.style.color = 'red';
            msgDiv.innerText = result.error || 'Registration failed';
        }
    });
</script>

</body>
</html>
